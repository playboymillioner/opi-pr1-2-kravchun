<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Кравчун Артем</title>
<style>
body {
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:#eef2f6;
    color:#16202a;
    font-family:Arial,Helvetica,sans-serif;
}
.panel {
    width:620px;
    background:#ffffff;
    border:1px solid #8c99a6;
    padding:34px 38px;
    box-shadow:0 8px 24px rgba(20,35,50,.08);
}
.code {
    font:12px Consolas,monospace;
    color:#607080;
    letter-spacing:.08em;
}
h1 {
    margin:12px 0 8px;
    font-size:34px;
    letter-spacing:-.02em;
}
.line {
    height:3px;
    background:#2b3d52;
    margin:20px 0;
}
</style>
</head>
<body>
<section class="panel">
<div class="code">OPI / GIT / PRACTICE 1.2</div>
<div class="line"></div>
<h1>Артем <b>Кравчун</b></h1>
<p>Основи програмної інженерії 2026-2027</p>
</section>
</body>
</html>
